<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ライフホイール｜現在の満足度を見える化</title>
<style>
  :root { --ink:#334155; --muted:#788795; --line:#e6e9ed; --paper:#fff; --bg:#fafaf8; --accent:#4a90a4; }
  * { box-sizing:border-box; }
  body { margin:0; padding:40px 32px 56px; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Yu Gothic",YuGothic,Arial,sans-serif; }
  .page { max-width:1440px; margin:0 auto; }
  h1 { margin:0 0 8px; font-size:26px; letter-spacing:.02em; }
  .subtitle { margin:0; color:var(--muted); font-size:14px; line-height:1.8; }
  .scale-guide { display:flex; align-items:center; gap:12px; margin:20px 0 32px; padding:13px 16px; background:#f1f7f8; border:1px solid #dcebed; border-radius:10px; font-size:13px; }
  .scale-guide strong { color:#315f6b; }
  .guide-line { flex:1; height:4px; min-width:60px; border-radius:99px; background:linear-gradient(90deg,#cbd5da,#4a90a4); }
  .main { display:grid; grid-template-columns:470px minmax(0,1fr); gap:42px; align-items:start; }
  .wheel-panel { position:sticky; top:24px; padding-top:26px; }
  .wheel-wrap { width:460px; max-width:100%; aspect-ratio:1; }
  canvas { width:100%; height:100%; display:block; }
  .section-title { margin-bottom:18px; padding-bottom:10px; border-bottom:1px solid var(--line); color:#7b8790; font-size:12px; font-weight:700; letter-spacing:.08em; }
  .item { margin-bottom:24px; }
  .item-header { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:10px; }
  .item-label { display:flex; align-items:center; flex-wrap:wrap; gap:7px; font-size:14px; font-weight:600; }
  .dot { width:9px; height:9px; border-radius:50%; flex:none; }
  .en { color:#a0a8ae; font-size:10px; font-weight:400; }
  .score-display { min-width:55px; text-align:right; font-size:13px; font-weight:700; }
  .score-display b { font-size:20px; }
  .range-row { display:grid; grid-template-columns:112px minmax(100px,1fr) 112px; align-items:center; gap:12px; }
  .range-end { color:#7d8991; font-size:11px; line-height:1.35; }
  .range-end:last-child { text-align:right; }
  .range-end strong { display:block; color:#4b5963; font-size:12px; }
  input[type=range] { width:100%; height:5px; margin:0; border-radius:99px; outline:none; cursor:pointer; appearance:none; -webkit-appearance:none; background:linear-gradient(90deg,#d9e0e3,#a7bac0); }
  input[type=range]::-webkit-slider-thumb { width:19px; height:19px; border:3px solid currentColor; border-radius:50%; background:white; box-shadow:0 1px 4px rgba(0,0,0,.12); cursor:pointer; appearance:none; -webkit-appearance:none; }
  input[type=range]::-moz-range-thumb { width:14px; height:14px; border:3px solid currentColor; border-radius:50%; background:white; box-shadow:0 1px 4px rgba(0,0,0,.12); cursor:pointer; }
  .memo { width:100%; min-height:48px; margin-top:10px; padding:10px 12px; border:1px solid #dfe3e6; border-radius:7px; background:white; color:var(--ink); font:12px/1.55 inherit; resize:vertical; }
  .memo:focus { outline:2px solid #d6e8ec; border-color:#91b6bf; }
  .memo::placeholder { color:#a8afb4; }
  .total-bar { margin-top:30px; padding:18px 20px; border:1px solid var(--line); border-radius:10px; background:white; }
  .total-label { margin-bottom:4px; color:#8d979e; font-size:12px; }
  .total-value { font-size:30px; font-weight:700; }
  .total-max { color:#9aa3aa; font-size:15px; font-weight:400; }
  .total-sub { margin-top:2px; color:#9aa3aa; font-size:12px; }
  .advice { margin-top:16px; padding:26px 28px; border:1px solid #e1e7eb; border-radius:12px; background:white; color:#526272; font-size:14px; line-height:1.85; }
  .advice-title { margin:0 0 20px; color:#334f58; font-size:19px; }
  .advice-section { margin-top:22px; }
  .advice-section:first-of-type { margin-top:0; }
  .advice-section h3 { margin:0 0 8px; color:#3d6670; font-size:14px; }
  .advice-section p { margin:0; }
  .advice-section ul { margin:7px 0 0; padding-left:1.4em; }
  .advice-section li + li { margin-top:5px; }
  .reflection { padding:14px 16px; border-left:3px solid #8ab5bf; background:#f5f9fa; }
  .consultation { margin-top:26px; padding:20px 22px; border-radius:10px; background:#f3f1f8; color:#545067; }
  .consultation h3 { margin:0 0 9px; color:#61587b; font-size:15px; }
  .consultation p { margin:0; }
  .consultation-btn { display:inline-flex; align-items:center; justify-content:center; min-height:46px; margin-top:14px; padding:11px 24px; border-radius:8px; background:#756a90; color:white; font-size:14px; font-weight:700; text-decoration:none; }
  .consultation-note { margin-top:8px !important; color:#807991; font-size:11px; }
  .save-guide { margin-top:24px; padding:22px 24px; border:1px solid #d8e6e9; border-radius:12px; background:#f3f8f9; }
  .save-guide h2 { margin:0 0 10px; color:#315f6b; font-size:16px; }
  .save-guide p { margin:0; color:#556670; font-size:13px; line-height:1.85; }
  .save-guide strong { color:#334f58; }
  .print-btn { width:100%; margin-top:16px; padding:13px 20px; border:0; border-radius:8px; background:#3f7e8d; color:white; font-size:14px; font-weight:700; cursor:pointer; transition:.15s; }
  .print-btn:hover { background:#336d7a; }
  .print-note { margin-top:8px; color:#8b979e; font-size:11px; text-align:center; }
  @media(max-width:850px) {
    body { padding:24px 16px 40px; }
    .main { grid-template-columns:1fr; gap:20px; }
    .wheel-panel { position:static; display:flex; justify-content:center; padding-top:0; }
    .wheel-wrap { width:min(460px,100%); }
    .scale-guide { flex-wrap:wrap; }
    .guide-line { order:3; flex-basis:100%; }
  }
  @media(max-width:520px) {
    h1 { font-size:23px; }
    .range-row { grid-template-columns:74px minmax(80px,1fr) 74px; gap:8px; }
    .range-end { font-size:9px; }
    .range-end strong { font-size:11px; }
    .en { display:none; }
    .save-guide,.advice { padding:18px; }
  }
  @media print {
    @page { size:A4 portrait; margin:10mm; }
    body { padding:0; background:white; print-color-adjust:exact; -webkit-print-color-adjust:exact; }
    .page { max-width:none; }
    .main { display:block; }
    .wheel-panel { position:static; display:flex; justify-content:center; padding:0; }
    .wheel-wrap { width:310px; }
    .item { break-inside:avoid; margin-bottom:12px; }
    .memo { min-height:34px; }
    .print-btn,.print-note { display:none; }
    .advice-section,.consultation,.save-guide { break-inside:avoid; }
  }
</style>
</head>
<body>
<main class="page">
  <h1>ライフホイール</h1>
  <p class="subtitle">8つの領域について、現在のあなたがどのくらい満足しているかを採点してください。<br>現在の満足度を直感で選びましょう。正解・不正解はありません。</p>
  <div class="scale-guide" aria-label="採点基準">
    <span><strong>1点</strong>＝不満足</span>
    <span class="guide-line" aria-hidden="true"></span>
    <span><strong>10点</strong>＝満足</span>
  </div>

  <div class="main">
    <section class="wheel-panel" aria-label="ライフホイールのグラフ">
      <div class="wheel-wrap"><canvas id="wheel" width="480" height="480"></canvas></div>
    </section>
    <section class="controls">
      <div class="section-title">現在の満足度を1〜10点で採点する</div>
      <div id="sliders"></div>
      <div class="total-bar">
        <div class="total-label">合計スコア</div>
        <div class="total-value"><span id="total">40</span><span class="total-max"> / 80点</span></div>
        <div class="total-sub" id="total-sub">平均 5.0 点</div>
      </div>
      <section class="advice" id="advice" aria-live="polite"></section>
      <aside class="save-guide">
        <h2>診断結果を保存してください</h2>
        <p>この診断に入力した情報は、<strong>ネット上には保存されません。</strong><br>
        下のボタンから結果を必ず保存し、公式LINEへ送付してください。<br>
        お一人おひとりのお悩みや理想を把握し、質問や不安がある際のキャリアアドバイスに反映させていただきます。</p>
        <button class="print-btn" type="button" onclick="window.print()">診断結果を印刷・PDFで保存する</button>
        <div class="print-note">保存画面で「PDFとして保存」を選択してください</div>
      </aside>
    </section>
  </div>
</main>

<script>
const CONSULTATION_URL='';
const ITEMS=[
  {key:'health',label:'健康（体／心）',chartLabel:'健康（体／心）',en:'Health',color:'#4A90A4',prompt:'体調・睡眠・運動などで気になっていること、理想の状態を書いてみましょう。',example:'例：毎日疲れが取れにくく、数字達成のストレスも多い。残業を減らし、休日は安心して眠り、家族と落ち着いて過ごせる心の余裕がほしい。',value:'心と身体の余裕',action:'今週中に10分だけ、心や身体の負担になっていることと、減らせそうなことを一つずつ書き出す',question:'無理なく過ごせる状態に近づくために、今減らせそうな負担は何ですか？',topic:'無理なく働き続けるための環境や過ごし方'},
  {key:'career',label:'仕事・キャリア',chartLabel:'仕事・キャリア',en:'Career',color:'#7B9E87',prompt:'今の仕事で満足していること、不満に感じること。今後実現したい働き方を書いてみましょう。',example:'例：現状は人間関係に満足しているが、成長ややりがいを感じにくい。3年以内にマネジメントや育成を経験し、5年以内に正社員と副業を両立したい。',value:'成長や自分らしい働き方',action:'今週の日曜日に10分だけ、今の仕事で「続けたいこと」と「変えたいこと」を一つずつ書く',question:'今の仕事の満足度が1点上がるとしたら、何が変わっていますか？',topic:'今後の働き方やキャリアの方向性'},
  {key:'finance',label:'お金・経済',chartLabel:'お金・経済',en:'Finance',color:'#E8956D',prompt:'収入・貯蓄・将来のお金についての不安と、目指したい状態を書いてみましょう。',example:'例：毎月の貯金ができず不安。将来は、家族と一緒に年2回旅行できるような収入を得たい。',value:'将来の安心や家族との経験',action:'今週15分だけ、現在のお金の不安と、実現したい暮らしに必要なことを分けて書く',question:'収入や働き方が少し整ったら、どのような時間を増やしたいですか？',topic:'収入への不安や今後の働き方'},
  {key:'relation',label:'人間関係',chartLabel:'人間関係',en:'Relationships',color:'#9B59B6',prompt:'友人・職場・恋愛などの人間関係で、心地よいことや負担に感じることを書いてみましょう。',example:'例：職場の上司と仕事の進め方が合わず、個人成果重視で周囲もギスギスしている。チームで協力して進められる職場で働きたい。',value:'安心して協力できる関係',action:'今週10分だけ、負担を感じる場面と「本当はどう関わりたいか」を一つずつメモする',question:'どのような人や環境であれば、安心して力を発揮できそうですか？',topic:'職場での人間関係や自分に合う環境'},
  {key:'family',label:'家族',chartLabel:'家族',en:'Family',color:'#E67E22',prompt:'家族との関係で大切にできていること、気がかりなこと、理想の関わり方を書いてみましょう。',example:'例：平日は帰りが遅く、忙しさから会話が減っている。平日もゆっくり話せる時間をつくりたい。',value:'家族との時間やつながり',action:'今週、家族と落ち着いて話す15分を一度だけ予定に入れる',question:'本当は、家族とどのような時間を増やしたいですか？',topic:'仕事と家族との時間のバランス'},
  {key:'fun',label:'趣味・楽しみ',chartLabel:'趣味・楽しみ',en:'Fun & Recreation',color:'#1ABC9C',prompt:'最近楽しかったこと、できていないこと、これからもっと時間を使いたいことを書いてみましょう。',example:'例：休日も仕事のことを考えてしまう。趣味を持ち、家族との旅行も楽しめる心と時間の余裕がほしい。',value:'自分らしい時間や心の余白',action:'次の休日に15分だけ、以前楽しかったことを一つ試す予定を入れる',question:'仕事以外で、これから増やしたい「自分らしい時間」は何ですか？',topic:'自分らしい時間や日々の過ごし方'},
  {key:'growth',label:'学び・成長',chartLabel:'学び・成長',en:'Personal Growth',color:'#3498DB',prompt:'成長を感じていること、伸ばしたいスキル、挑戦してみたいことを書いてみましょう。',example:'例：仕事がルーティン化している。営業だけでなく、マーケティングやマネジメントを学び、新しい仕事に挑戦したい。',value:'新しい学びや挑戦',action:'今週10分だけ、学びたいテーマを一つ選び、最初に見る記事や動画を決める',question:'今後の理想に近づくために、まず伸ばしたい力は何ですか？',topic:'これから伸ばしたいことやキャリアの方向性'},
  {key:'env',label:'生活環境',chartLabel:'生活環境',en:'Physical Environment',color:'#95A5A6',prompt:'住まい・通勤・生活リズム・働く場所で、気になることと理想の環境を書いてみましょう。',example:'例：通勤時間が1.5時間と長く、平日にほとんど余裕がない。在宅勤務も取り入れ、自分や家族との時間を増やしたい。',value:'生活と仕事のバランス',action:'平日の中で最も負担を感じる時間帯を一つ選び、10分だけ減らせることを考える',question:'暮らしの満足度が1点上がるとしたら、毎日の何が変わっていますか？',topic:'日々の過ごし方や働く環境'}
];
const scores=Object.fromEntries(ITEMS.map(item=>[item.key,5]));
const sliders=document.getElementById('sliders');

ITEMS.forEach(item=>{
  const wrap=document.createElement('div');
  wrap.className='item';
  wrap.innerHTML=`
    <div class="item-header">
      <div class="item-label"><span class="dot" style="background:${item.color}"></span>${item.label}<span class="en">${item.en}</span></div>
      <div class="score-display" id="score-${item.key}" style="color:${item.color}"><b>5</b> / 10</div>
    </div>
    <div class="range-row">
      <span class="range-end"><strong>1</strong>不満足</span>
      <input aria-label="${item.label}の満足度" type="range" min="1" max="10" step="1" value="5" id="range-${item.key}" style="color:${item.color}">
      <span class="range-end"><strong>10</strong>満足</span>
    </div>
    <textarea class="memo" rows="3" placeholder="${item.prompt}\n${item.example}" id="memo-${item.key}" aria-label="${item.label}についてのメモ"></textarea>`;
  sliders.appendChild(wrap);
  const range=wrap.querySelector('input');
  range.addEventListener('input',()=>{
    scores[item.key]=Number(range.value);
    wrap.querySelector('.score-display').innerHTML=`<b>${range.value}</b> / 10`;
    drawWheel(); updateAdvice();
  });
  wrap.querySelector('.memo').addEventListener('input',updateAdvice);
});

function drawWheel(){
  const canvas=document.getElementById('wheel'),ctx=canvas.getContext('2d');
  const size=480,c=size/2,R=160,n=ITEMS.length,step=Math.PI*2/n,start=-Math.PI/2;
  ctx.clearRect(0,0,size,size);
  for(let ring=1;ring<=10;ring++){
    const r=R*ring/10; ctx.beginPath();
    for(let i=0;i<n;i++){const a=start+i*step,x=c+r*Math.cos(a),y=c+r*Math.sin(a);i?ctx.lineTo(x,y):ctx.moveTo(x,y)}
    ctx.closePath();ctx.strokeStyle=ring===5?'#ccd4d8':'#e6e9eb';ctx.lineWidth=ring===5?1.3:.8;ctx.stroke();
  }
  for(let i=0;i<n;i++){const a=start+i*step;ctx.beginPath();ctx.moveTo(c,c);ctx.lineTo(c+R*Math.cos(a),c+R*Math.sin(a));ctx.strokeStyle='#e0e5e7';ctx.lineWidth=.8;ctx.stroke()}
  ctx.beginPath();
  ITEMS.forEach((item,i)=>{const r=R*scores[item.key]/10,a=start+i*step,x=c+r*Math.cos(a),y=c+r*Math.sin(a);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});
  ctx.closePath();ctx.fillStyle='rgba(74,144,164,.16)';ctx.fill();ctx.strokeStyle='#4A90A4';ctx.lineWidth=2;ctx.stroke();
  ITEMS.forEach((item,i)=>{const r=R*scores[item.key]/10,a=start+i*step,x=c+r*Math.cos(a),y=c+r*Math.sin(a);ctx.beginPath();ctx.arc(x,y,4.5,0,Math.PI*2);ctx.fillStyle=item.color;ctx.fill()});
  ITEMS.forEach((item,i)=>{
    const a=start+i*step,labelR=R+42,x=c+labelR*Math.cos(a),y=c+labelR*Math.sin(a),direction=Math.cos(a);
    ctx.textAlign=direction>.3?'right':direction<-.3?'left':'center';
    ctx.textBaseline='middle';ctx.font='600 12px sans-serif';ctx.fillStyle=item.color;ctx.fillText(item.chartLabel,x,y);
  });
}

function collectResponses(){
  return ITEMS.map(item=>({
    ...item,
    score:Math.max(1,Math.min(10,Number(scores[item.key])||5)),
    memo:(document.getElementById(`memo-${item.key}`)?.value||'').trim()
  }));
}

function detectSafetyRisk(responses){
  const text=responses.map(r=>r.memo).join(' ');
  return /死にたい|消えたい|自殺|自傷|生きていたくない|虐待|暴力を受け|殺されそう/.test(text);
}

function analyzeResponses(responses){
  const total=responses.reduce((sum,r)=>sum+r.score,0);
  const average=total/responses.length;
  const max=Math.max(...responses.map(r=>r.score));
  const min=Math.min(...responses.map(r=>r.score));
  const isFlat=max===min;
  const withMemo=responses.filter(r=>r.memo.length>0);
  const ranked=[...responses].sort((a,b)=>b.score-a.score);
  const highItems=isFlat?[]:ranked.filter(r=>r.score>=7).slice(0,2);
  let priorityItems=[];
  if(isFlat){
    priorityItems=[...withMemo].sort((a,b)=>b.memo.length-a.memo.length).slice(0,2);
  }else{
    priorityItems=[...responses]
      .sort((a,b)=>((11-b.score)*8+Math.min(b.memo.length,120)/8)-((11-a.score)*8+Math.min(a.memo.length,120)/8))
      .filter(r=>r.score<=6||r.memo.length>=20).slice(0,2);
  }
  const fullText=withMemo.map(r=>r.memo).join(' ');
  const values=[];
  const valueRules=[
    [/家族|子ども|子供|旅行/, '家族との時間や経験'],
    [/成長|挑戦|学び|スキル|マネジメント|育成/, '成長や新しい挑戦'],
    [/余裕|残業|睡眠|疲れ|休み/, '心と身体の余裕'],
    [/協力|チーム|人間関係|上司/, '安心して協力できる関係'],
    [/収入|貯金|お金|副業/, '将来の安心や働き方の選択肢']
  ];
  valueRules.forEach(([pattern,value])=>{if(pattern.test(fullText)&&!values.includes(value))values.push(value)});
  if(!values.length&&highItems.length) values.push(...highItems.map(r=>r.value));
  if(!values.length&&withMemo.length) values.push(withMemo[0].value);
  return {responses,total,average,max,min,spread:max-min,isFlat,withMemo,highItems,priorityItems,values:values.slice(0,2),allHigh:min>=9,allLow:max<=3,safetyFlag:detectSafetyRisk(responses)};
}

function buildKeepText(a){
  if(a.allHigh) return '8つの領域すべてで高い満足度が保たれています。今うまくいっている理由や、日頃自然に続けている工夫を言葉にしておくと、この状態をこれからも大切にしやすくなります。';
  if(a.highItems.length){
    const names=a.highItems.map(r=>r.label).join('・');
    const values=a.values.length?a.values.join('や'):'今の生活で心地よいと感じられること';
    return `${names}は、現在の満足度が比較的高い領域です。回答からは、${values}を大切にしたい気持ちがうかがえます。そこで自然にできていることは、ほかの領域を整えるときのヒントにもなりそうです。`;
  }
  if(a.values.length) return `自由記述からは、${a.values.join('や')}を大切にしたい気持ちがうかがえます。自分の理想や気がかりを言葉にできていること自体が、次の選択を考えるための大切な土台です。`;
  return '今回、自分の状態を立ち止まって振り返ったこと自体が大切な一歩です。点数だけで良し悪しを決めず、今できていることや、これからも続けたいことにも目を向けてみましょう。';
}

function buildPriorityText(a){
  if(a.allLow) return '複数の領域で、今は負担や迷いを感じている可能性があります。すべてを一度に変える必要はありません。まずは今いちばん心に残っていることを一つだけ選び、休む・書き出す・信頼できる人に話すなど、負担の少ない方法から整理してみてもよいかもしれません。';
  if(!a.priorityItems.length) return '8つの領域に大きな点数差はありません。どこかを無理に「改善する項目」と決める必要はなく、今の満足度を1点上げるなら何が変わるか、気になる領域を一つ選んで考えるところから始められます。';
  return a.priorityItems.map(r=>{
    if(r.score<=3) return `${r.label}については、今少し負担や迷いを感じているのかもしれません。理想との距離を責めず、まずは一番気になっていることを一つだけ整理してみましょう。`;
    if(r.score<=6) return `${r.label}は、一定の満足感がある一方で、もう少し整えていきたい思いもありそうです。今保てていることを残しながら、満足度を1点上げる小さな変化を考えてみましょう。`;
    return `${r.label}は比較的満足度が高い一方で、自由記述からはさらに実現したい理想もあるようです。良い状態を保ちながら、次に増やしたい経験を考えてみてもよいかもしれません。`;
  }).join('<br><br>');
}

function selectActions(a){
  if(a.allLow) return ['今週中に10分だけ時間を取り、今気になっていることを3つまで紙に書き、その中から最も負担が少ない一つを選ぶ'];
  if(!a.priorityItems.length) return ['今週の日曜日に10分だけ、8領域の中から「1点上がるとうれしい項目」を一つ選び、変わっていてほしいことを書く'];
  const actions=a.priorityItems.map(r=>r.action);
  if(a.highItems.length) actions.push(`${a.highItems[0].label}で、今うまくいっている理由を一つメモし、続けたい工夫を確認する`);
  return [...new Set(actions)].slice(0,3);
}

function selectQuestion(a){
  if(a.priorityItems.length) return a.priorityItems[0].question;
  if(a.allHigh) return '今の良い状態を大切にしながら、次に挑戦してみたいことは何ですか？';
  return '満足度が1点上がるとしたら、日常の何が少し変わっていますか？';
}

function buildConsultationCTA(a){
  const topics=a.priorityItems.map(r=>r.topic).slice(0,2);
  if(a.allHigh) return '今回の診断から、現在の生活の中で大切にできていることが多くあることがうかがえます。個別面談では、今うまくいっていることを整理しながら、これから挑戦したいことや、さらに充実させたいことも一緒に考えます。今の良い状態を大切にしながら、次に目指したいことを言葉にしてみませんか。ぜひ、個別面談で、これからの理想についてもお話ししましょう！';
  if(!topics.length) return '今回の診断で見えてきたことを、一人でもう少し考えてみることも大切です。一方で、自分のことだからこそ、何から整理すればよいか分からなくなることもあります。個別面談では、今回の回答をもとに、大切にしたいことや最初の一歩を一緒に整理します。まだ悩みがまとまっていなくても大丈夫です。ぜひ、個別面談で、今回見えてきた悩みや理想についてもお話ししましょう！';
  return `今回の診断から、${topics.join('、')}について、少し立ち止まって考えたい気持ちがうかがえます。一人で考えていると、どこから整理すればよいか迷うこともあります。個別面談では、これまでの経験や大切にしたいことを伺いながら、今後の選択肢と最初の一歩を一緒に整理します。まだ転職すると決めていなくても大丈夫です。ぜひ、個別面談で、${topics.join('や')}についてもお話ししましょう！`;
}

function renderSafetyAdvice(a){
  document.getElementById('advice').innerHTML=`
    <h2 class="advice-title">今回の診断を終えて</h2>
    <div class="advice-section"><p>自分の状態を言葉にしてくださったことは、とても大切な一歩です。記入内容から、今は強い苦痛や危険を感じている可能性があります。</p></div>
    <div class="advice-section"><h3>今、優先してほしいこと</h3><p>一人で抱え込まず、まずは身近で信頼できる人や、医療機関・地域の相談窓口などの専門的な支援へつながることを優先してください。差し迫った危険がある場合は、地域の緊急窓口を利用してください。ここで無理に答えや行動計画を決める必要はありません。</p></div>`;
}

function updateAdvice(){
  const a=analyzeResponses(collectResponses());
  document.getElementById('total').textContent=a.total;
  document.getElementById('total-sub').textContent=`平均 ${a.average.toFixed(1)} 点`;
  if(a.safetyFlag){renderSafetyAdvice(a);return}
  const trend=a.isFlat
    ? `8つの領域はすべて${a.min}点でした。今は特定の項目だけを評価するより、生活全体を見渡しながら考えるタイミングなのかもしれません。`
    : `全体の平均は${a.average.toFixed(1)}点で、項目間には${a.spread}点の幅がありました。この差は良し悪しではなく、今の生活で力を注げていることと、少し余白をつくりたいことを知る手がかりです。`;
  const actions=selectActions(a).map(action=>`<li>${action}。まずは一度だけ試し、合わなければ方法やタイミングを変えてみましょう。</li>`).join('');
  const button=CONSULTATION_URL?`<a class="consultation-btn" href="${CONSULTATION_URL}" target="_blank" rel="noopener">個別面談で相談する</a>`:'';
  document.getElementById('advice').innerHTML=`
    <h2 class="advice-title">あなたへのアドバイス</h2>
    <div class="advice-section"><h3>今回の診断を終えて</h3><p>忙しい中でも、自分の状態を振り返ろうとしたことは、とても大切な一歩です。${trend}</p></div>
    <div class="advice-section"><h3>今のあなたが大切にできていること</h3><p>${buildKeepText(a)}</p></div>
    <div class="advice-section"><h3>これから少し整えていきたいこと</h3><p>${buildPriorityText(a)}</p></div>
    <div class="advice-section"><h3>まず試してみること</h3><ul>${actions}</ul></div>
    <div class="advice-section reflection"><h3>自分への問いかけ</h3><p>${selectQuestion(a)}</p></div>
    <div class="advice-section"><h3>最後に</h3><p>すべてを一度に変える必要はありません。今回見つけた小さな一歩を、自分に合うペースで試してみてください。うまくいかない日があっても、それは後戻りではなく、自分に合う方法を知っていく途中です。</p></div>
    <div class="consultation"><h3>もう少し整理してみたい方へ</h3><p>${buildConsultationCTA(a)}</p>${button}<p class="consultation-note">まだ転職すると決めていない方もご相談いただけます。今のお悩みがまとまっていなくても大丈夫です。</p></div>`;
}

let printHeights=[];
window.addEventListener('beforeprint',()=>{
  printHeights=[...document.querySelectorAll('.memo')].map(el=>el.style.height);
  document.querySelectorAll('.memo').forEach(el=>{el.style.height='auto';el.style.height=`${el.scrollHeight+4}px`});
});
window.addEventListener('afterprint',()=>document.querySelectorAll('.memo').forEach((el,i)=>el.style.height=printHeights[i]||''));

drawWheel();updateAdvice();
</script>
</body>
</html>
